<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIVERGATE RESIDENCE - Đăng Ký Sảnh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --primary: #6c5ce7;
            --primary-light: rgba(108, 92, 231, 0.15);
            --primary-glow: rgba(108, 92, 231, 0.4);
            --bg-dark: #090714;
            --card-bg: rgba(20, 16, 38, 0.6);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-light: #f3f0ff;
            --text-muted: #a29bfe;
            --success: #00b894;
            --success-light: rgba(0, 184, 148, 0.15);
            --error: #ff7675;
            --error-light: rgba(255, 118, 117, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 50% 0%, #1e1545 0%, var(--bg-dark) 70%);
            color: var(--text-light);
            min-height: 100vh;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            padding-top: 10px;
        }

        header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 15px var(--primary-glow);
            margin-bottom: 6px;
        }

        header p {
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 22px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 14px 16px;
            color: #fff;
            font-size: 14px;
            transition: all 0.25s ease;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        /* Red glow for mandatory empty inputs */
        .form-control:required:invalid {
            border-color: rgba(255, 118, 117, 0.4);
        }

        .guest-section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .guest-list-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 16px;
        }

        /* Styled Guest Row */
        .guest-row {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 16px;
            position: relative;
            animation: slideIn 0.25s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .guest-row-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .guest-number {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
        }

        .btn-delete-guest {
            background: transparent;
            border: none;
            color: var(--error);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            padding: 2px 6px;
            transition: opacity 0.2s;
        }

        .btn-delete-guest:hover {
            opacity: 0.8;
        }

        .guest-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 12px;
        }

        /* Styled select */
        select.form-control {
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg fill='white' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/><path d='M0 0h24v24H0z' fill='none'/></svg>");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 18px;
            padding-right: 30px;
        }

        /* Button to add new guest row */
        .btn-add-guest {
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed var(--card-border);
            border-radius: 12px;
            padding: 12px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 20px;
        }

        .btn-add-guest:hover {
            background: var(--primary-light);
            border-color: var(--primary);
            color: #fff;
        }

        /* Submit action button */
        .btn-submit {
            width: 100%;
            background: linear-gradient(90deg, #6c5ce7 0%, #a29bfe 100%);
            border: none;
            border-radius: 14px;
            padding: 16px;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 5px 20px var(--primary-glow);
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--primary);
        }

        .btn-submit:disabled {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.3);
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* Progress list */
        .status-tracker {
            margin-top: 15px;
            display: none;
        }

        .status-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .status-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .status-pending {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .status-running {
            background: var(--primary-light);
            color: var(--text-muted);
            animation: blink 1.2s infinite;
        }

        .status-success {
            background: var(--success-light);
            color: var(--success);
        }

        .status-error {
            background: var(--error-light);
            color: var(--error);
        }

        @keyframes blink {
            50% { opacity: 0.6; }
        }

        .results-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            border-left: 3px solid var(--primary);
            padding-left: 10px;
        }

        .results-title {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0;
            border-left: none;
            padding-left: 0;
        }

        .btn-download-all {
            background: linear-gradient(90deg, var(--success) 0%, #00cec9 100%);
            border: none;
            color: white;
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--success-light);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .btn-download-all:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--success);
        }

        .guest-result-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 18px;
        }

        .guest-result-header {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .screenshot-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .screenshot-item {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 8px;
            text-align: center;
        }

        .screenshot-item p {
            font-size: 10px;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .screenshot-img-wrapper {
            position: relative;
            width: 100%;
            height: 220px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: #000;
        }

        .screenshot-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            display: block;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .screenshot-img-wrapper:hover .screenshot-img {
            transform: scale(1.04);
        }

        /* Modal for zooming images */
        /* Fullscreen Lightbox Carousel Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 10000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(5, 4, 12, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.25s ease;
            box-sizing: border-box;
            padding: 10px;
        }

        .modal.show {
            display: flex;
            opacity: 1;
        }

        .lightbox-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 900px;
            height: 94vh;
            max-height: 94vh;
            background: #110e24;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 30px var(--primary-glow);
            transform: scale(0.95);
            transition: transform 0.25s ease;
        }

        .modal.show .lightbox-container {
            transform: scale(1);
        }

        .lightbox-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .lightbox-info {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }

        .lightbox-caption {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-light);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .lightbox-counter {
            font-size: 12px;
            font-weight: 500;
            padding: 3px 10px;
            background: var(--primary-light);
            color: #a29bfe;
            border-radius: 12px;
            border: 1px solid var(--primary-glow);
            white-space: nowrap;
        }

        .lightbox-close {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .lightbox-close:hover {
            background: var(--error);
            color: #fff;
            border-color: var(--error);
        }

        .lightbox-stage {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #080611;
            user-select: none;
            touch-action: pan-y;
        }

        .lightbox-img-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            box-sizing: border-box;
        }

        .lightbox-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.5);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .lightbox-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: rgba(18, 14, 38, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }

        .lightbox-nav-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
            transform: translateY(-50%) scale(1.1);
        }

        .lightbox-nav-btn.prev {
            left: 14px;
        }

        .lightbox-nav-btn.next {
            right: 14px;
        }

        .lightbox-bottombar {
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.03);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .lightbox-action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 9px 20px;
            background: var(--primary);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 14px var(--primary-glow);
            font-family: inherit;
        }

        .lightbox-action-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px var(--primary-glow);
            background: #7c6df8;
        }

        .lightbox-hint {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
        }

        .screenshot-img-wrapper {
            position: relative;
            cursor: pointer;
            border-radius: 8px;
            overflow: hidden;
        }

        .zoom-badge {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(18, 14, 38, 0.85);
            backdrop-filter: blur(4px);
            color: #fff;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.15);
            pointer-events: none;
            transition: all 0.2s;
        }

        .screenshot-img-wrapper:hover .zoom-badge {
            background: var(--primary);
            border-color: var(--primary);
        }

        @media (max-width: 600px) {
            .lightbox-container {
                height: 98vh;
                max-height: 98vh;
                border-radius: 12px;
            }
            .lightbox-topbar {
                padding: 10px 14px;
            }
            .lightbox-caption {
                font-size: 13px;
            }
            .lightbox-nav-btn {
                width: 38px;
                height: 38px;
            }
            .lightbox-nav-btn.prev { left: 8px; }
            .lightbox-nav-btn.next { right: 8px; }
            .lightbox-bottombar {
                padding: 10px 14px;
                flex-direction: column;
                gap: 8px;
            }
            .lightbox-action-btn {
                width: 100%;
            }
            .lightbox-hint {
                font-size: 11px;
            }
        }

        /* Live Console Log Styling */
        .log-display-box {
            margin-top: 20px;
            background: #121216;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .log-header {
            background: #1c1c22;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .log-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .log-dot.red { background: #ff5f56; }
        .log-dot.yellow { background: #ffbd2e; }
        .log-dot.green { background: #27c93f; }

        .log-title {
            margin-left: 8px;
            font-size: 11px;
            color: var(--text-muted);
            font-family: var(--font-primary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 500;
        }

        .log-console {
            margin: 0;
            padding: 14px;
            max-height: 180px;
            overflow-y: auto;
            color: #50fa7b;
            background: #121216;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            text-align: left;
            scrollbar-width: thin;
        }

        /* Individual Screenshot Download Button */
        .btn-download-single {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-light);
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--font-primary);
            width: 100%;
            box-sizing: border-box;
        }

        .btn-download-single:hover {
            background: var(--primary-light);
            border-color: var(--primary);
            color: #fff;
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .btn-download-single svg {
            margin-right: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>RIVERGATE RESIDENCE</h1>
            <p>Đăng ký sảnh tự động & xuất ảnh minh chứng</p>
        </header>

        <main class="card">
            <form id="submissionForm" onsubmit="handleFormSubmit(event)">
                <!-- Global Apartment Code -->
                <div class="form-group">
                    <label>Mã Căn Hộ (Unit Code) *</label>
                    <input type="text" id="unitCode" class="form-control" required placeholder="Ví dụ: A-12.34 hoặc A12.99" autocomplete="off">
                </div>

                <div class="guest-section-title">
                    <span>Danh Sách Khách Đăng Ký</span>
                </div>

                <!-- Guest list rows container -->
                <div class="guest-list-container" id="guestList">
                    <!-- Dynamic rows inserted here -->
                </div>

                <!-- Add Guest Row Button -->
                <button type="button" class="btn-add-guest" onclick="addGuestRow()">
                    <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                    </svg>
                    Thêm Khách Hàng (+)
                </button>

                <!-- Submit Button -->
                <button type="submit" id="btnSubmit" class="btn-submit">Bắt Đầu Đăng Ký & Chụp Ảnh</button>
            </form>

            <!-- Status Tracker -->
            <div class="status-tracker" id="statusTracker">
                <div class="guest-section-title" style="margin-top: 20px;">
                    <span>Tiến Trình Đăng Ký</span>
                </div>
                <div id="statusList"></div>
                
                <!-- Live Console Log Display -->
                <div class="log-display-box" id="logDisplayBox" style="display: none;">
                    <div class="log-header">
                        <div class="log-dot red"></div>
                        <div class="log-dot yellow"></div>
                        <div class="log-dot green"></div>
                        <span class="log-title">Live Server Console</span>
                    </div>
                    <pre class="log-console" id="logConsole">Khởi động...</pre>
                </div>
            </div>
        </main>

        <!-- Screenshots Results Area -->
        <section class="results-section" id="resultsSection">
            <div class="results-header-row">
                <h2 class="results-title">Ảnh Minh Chứng Đã Ghi Nhận</h2>
                <button type="button" class="btn-download-all" id="btnDownloadAll" onclick="downloadAllImages()">
                    <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24" style="margin-right: 6px; display: inline-block; vertical-align: middle;">
                        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/>
                    </svg>
                    Tải Toàn Bộ Ảnh
                </button>
            </div>
            <div id="resultsContainer"></div>
        </section>
    </div>

    <!-- Lightbox Carousel Modal -->
    <div id="imageModal" class="modal" onclick="closeLightbox(event)">
        <div class="lightbox-container" onclick="event.stopPropagation()">
            <!-- Top Bar -->
            <div class="lightbox-topbar">
                <div class="lightbox-info">
                    <span id="lightboxCaption" class="lightbox-caption">Ảnh Minh Chứng</span>
                    <span id="lightboxCounter" class="lightbox-counter">1 / 1</span>
                </div>
                <button type="button" class="lightbox-close" onclick="closeLightbox()" title="Đóng">&times;</button>
            </div>

            <!-- Image Viewport & Navigation -->
            <div class="lightbox-stage" id="lightboxStage">
                <button type="button" class="lightbox-nav-btn prev" onclick="prevSlide()" title="Ảnh trước (Phím ←)">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                    </svg>
                </button>

                <div class="lightbox-img-wrapper">
                    <img id="modalImg" class="lightbox-img" src="" alt="Ảnh minh chứng">
                </div>

                <button type="button" class="lightbox-nav-btn next" onclick="nextSlide()" title="Ảnh kế tiếp (Phím →)">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                    </svg>
                </button>
            </div>

            <!-- Bottom Actions -->
            <div class="lightbox-bottombar">
                <button type="button" class="lightbox-action-btn" onclick="saveCurrentSlideImage()">
                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24" style="margin-right: 6px; vertical-align: middle;">
                        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/>
                    </svg>
                    Lưu Ảnh Này Vào Máy
                </button>
                <div class="lightbox-hint">💡 Vuốt sang trái/phải trên màn hình để lướt ảnh</div>
            </div>
        </div>
    </div>

    <script>
        let guestCount = 0;
        let allImages = [];

        // Initialize form with 1 guest row
        window.addEventListener('load', () => {
            addGuestRow();
        });

        // Add a new guest input row
        function addGuestRow() {
            guestCount++;
            const container = document.getElementById('guestList');
            const row = document.createElement('div');
            row.className = 'guest-row';
            row.id = `guestRow-${guestCount}`;
            row.innerHTML = `
                <div class="guest-row-header">
                    <span class="guest-number">Khách hàng #${guestCount}</span>
                    <button type="button" class="btn-delete-guest" onclick="deleteGuestRow(${guestCount})">Xóa</button>
                </div>
                <div class="guest-grid">
                    <div>
                        <input type="text" class="form-control guest-passport" required placeholder="Hộ chiếu / CCCD" autocomplete="off">
                    </div>
                    <div>
                        <select class="form-control guest-gender">
                            <option value="female" selected>Nữ (F)</option>
                            <option value="male">Nam (M)</option>
                        </select>
                    </div>
                </div>
            `;
            container.appendChild(row);
            updateDeleteButtons();
        }

        // Delete a guest row
        function deleteGuestRow(id) {
            const row = document.getElementById(`guestRow-${id}`);
            if (row) {
                row.remove();
                reorderGuests();
                updateDeleteButtons();
            }
        }

        // Re-number guest headers
        function reorderGuests() {
            const rows = document.querySelectorAll('.guest-row');
            guestCount = 0;
            rows.forEach((row) => {
                guestCount++;
                row.id = `guestRow-${guestCount}`;
                const numberSpan = row.querySelector('.guest-number');
                numberSpan.textContent = `Khách hàng #${guestCount}`;
                
                const deleteBtn = row.querySelector('.btn-delete-guest');
                deleteBtn.setAttribute('onclick', `deleteGuestRow(${guestCount})`);
            });
        }

        // Hide delete buttons if only 1 row remains
        function updateDeleteButtons() {
            const deleteButtons = document.querySelectorAll('.btn-delete-guest');
            if (deleteButtons.length <= 1) {
                deleteButtons.forEach(btn => btn.style.display = 'none');
            } else {
                deleteButtons.forEach(btn => btn.style.display = 'block');
            }
        }

        // Form submit handler
        async function handleFormSubmit(e) {
            e.preventDefault();

            const unitCode = document.getElementById('unitCode').value.trim();
            const rows = document.querySelectorAll('.guest-row');
            
            if (rows.length === 0) return;

            const guestsData = [];
            rows.forEach(row => {
                const guestId = row.querySelector('.guest-passport').value.trim();
                const gender = row.querySelector('.guest-gender').value;
                guestsData.push({ guestId, gender });
            });

            // Reset displays and images array
            allImages = [];
            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.disabled = true;
            btnSubmit.textContent = "Đang thực hiện đăng ký...";

            document.getElementById('statusTracker').style.display = 'block';
            const statusList = document.getElementById('statusList');
            statusList.innerHTML = "";

            const resultsContainer = document.getElementById('resultsContainer');
            resultsContainer.innerHTML = "";
            document.getElementById('resultsSection').style.display = 'none';

            // Show live console box
            const logDisplayBox = document.getElementById('logDisplayBox');
            const logConsole = document.getElementById('logConsole');
            logDisplayBox.style.display = 'block';
            logConsole.textContent = "Đang kết nối tới máy chủ Render...\n";

            // Create progress indicators
            guestsData.forEach((g, index) => {
                const item = document.createElement('div');
                item.className = 'status-item';
                item.id = `statusItem-${index}`;
                item.innerHTML = `
                    <span>Khách #${index + 1} (${g.guestId})</span>
                    <span class="status-badge status-pending" id="statusBadge-${index}">Đang chờ</span>
                `;
                statusList.appendChild(item);
            });

            // Start log polling interval (fetch every 600ms)
            const logInterval = setInterval(async () => {
                try {
                    const logRes = await fetch('/status');
                    if (logRes.ok) {
                        const logData = await logRes.json();
                        if (logData.logs && logData.logs.length > 0) {
                            logConsole.textContent = logData.logs.join('\n');
                            logConsole.scrollTop = logConsole.scrollHeight; // Auto scroll to bottom
                        }
                    }
                } catch (e) {
                    console.error("Lỗi khi đọc log từ server:", e);
                }
            }, 600);

            // Process sequentially to protect server RAM
            for (let i = 0; i < guestsData.length; i++) {
                const badge = document.getElementById(`statusBadge-${i}`);
                badge.textContent = "Đang đăng ký...";
                badge.className = "status-badge status-running";

                const guest = guestsData[i];
                
                try {
                    const response = await fetch('/api/submit', {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            unitCode: unitCode,
                            guestId: guest.guestId,
                            gender: guest.gender
                        }),
                    });

                    const result = await response.json();

                    if (response.ok && result.success) {
                        badge.textContent = "Thành công";
                        badge.className = "status-badge status-success";
                        
                        // Add screenshots to results section
                        appendResultBox(result.guestName, guest.guestId, result.screenshot_filled, result.screenshot_submitted);
                    } else {
                        badge.textContent = "Thất bại";
                        badge.className = "status-badge status-error";
                        if (result.screenshot_filled) {
                            appendErrorBox(result.guestName || `Khách ${i+1}`, guest.guestId, result.error || "Gặp lỗi khi điền", result.screenshot_filled);
                        }
                    }
                } catch (err) {
                    badge.textContent = "Lỗi mạng";
                    badge.className = "status-badge status-error";
                    console.error(err);
                }
            }

            // Stop log polling interval
            clearInterval(logInterval);
            
            // Get final logs one last time
            try {
                const logRes = await fetch('/status');
                if (logRes.ok) {
                    const logData = await logRes.json();
                    logConsole.textContent = logData.logs.join('\n');
                    logConsole.scrollTop = logConsole.scrollHeight;
                }
            } catch (e) {}

            // Finished all
            btnSubmit.disabled = false;
            btnSubmit.textContent = "Bắt Đầu Đăng Ký & Chụp Ảnh";
        }

        // Add result details box
        function appendResultBox(name, passport, imgFilled, imgSubmitted) {
            document.getElementById('resultsSection').style.display = 'block';
            const container = document.getElementById('resultsContainer');
            
            const box = document.createElement('div');
            box.className = 'guest-result-box';
            
            const sanitizedName = name.replace(/\s+/g, '_');
            
            // Save to global list with titles for Carousel Navigation
            const filledIdx = allImages.length;
            allImages.push({ 
                data: imgFilled, 
                filename: `DienForm_${sanitizedName}.jpg`,
                title: `Khách: ${name} (${passport}) - 1. Form đã điền`
            });
            
            const submittedIdx = allImages.length;
            allImages.push({ 
                data: imgSubmitted, 
                filename: `XacNhan_${sanitizedName}.jpg`,
                title: `Khách: ${name} (${passport}) - 2. Biên nhận gửi`
            });
            
            box.innerHTML = `
                <div class="guest-result-header">
                    <span>Khách: ${name} (${passport})</span>
                    <span class="status-badge status-success">Đã Chụp Ảnh</span>
                </div>
                <div class="screenshot-grid">
                    <div class="screenshot-item">
                        <p>1. Form đã điền thông tin</p>
                        <div class="screenshot-img-wrapper" onclick="openLightbox(${filledIdx})">
                            <img class="screenshot-img" src="${imgFilled}" alt="Form đã điền">
                            <div class="zoom-badge">🔍 Xem Full Slide</div>
                        </div>
                        <button type="button" onclick="shareOrDownloadImage('${imgFilled}', 'DienForm_${sanitizedName}.jpg')" class="btn-download-single">
                            <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/>
                            </svg>
                            Lưu Ảnh Điền Form
                        </button>
                    </div>
                    <div class="screenshot-item">
                        <p>2. Biên nhận gửi thành công</p>
                        <div class="screenshot-img-wrapper" onclick="openLightbox(${submittedIdx})">
                            <img class="screenshot-img" src="${imgSubmitted}" alt="Xác nhận gửi">
                            <div class="zoom-badge">🔍 Xem Full Slide</div>
                        </div>
                        <button type="button" onclick="shareOrDownloadImage('${imgSubmitted}', 'XacNhan_${sanitizedName}.jpg')" class="btn-download-single">
                            <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/>
                            </svg>
                            Lưu Ảnh Biên Nhận
                        </button>
                    </div>
                </div>
            `;
            container.appendChild(box);
        }

        // Add error details box
        function appendErrorBox(name, passport, errorMsg, imgError) {
            document.getElementById('resultsSection').style.display = 'block';
            const container = document.getElementById('resultsContainer');
            
            const box = document.createElement('div');
            box.className = 'guest-result-box';
            box.style.borderColor = 'rgba(255, 118, 117, 0.3)';
            
            const errIdx = allImages.length;
            allImages.push({
                data: imgError,
                filename: `LoiForm_${name.replace(/\s+/g, '_')}.jpg`,
                title: `Khách: ${name} (${passport}) - Lỗi: ${errorMsg}`
            });
            
            box.innerHTML = `
                <div class="guest-result-header">
                    <span>Khách: ${name} (${passport})</span>
                    <span class="status-badge status-error">Lỗi: ${errorMsg}</span>
                </div>
                <div class="screenshot-grid">
                    <div class="screenshot-item">
                        <p>Ảnh sự cố</p>
                        <div class="screenshot-img-wrapper" onclick="openLightbox(${errIdx})">
                            <img class="screenshot-img" src="${imgError}" alt="Lỗi form">
                            <div class="zoom-badge">🔍 Xem Full Slide</div>
                        </div>
                        <button type="button" onclick="shareOrDownloadImage('${imgError}', 'LoiForm_${name.replace(/\s+/g, '_')}.jpg')" class="btn-download-single">
                            <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/>
                            </svg>
                            Lưu Ảnh Lỗi
                        </button>
                    </div>
                </div>
            `;
            container.appendChild(box);
        }

        // Download all images with delay to avoid browser blocking
        function downloadAllImages() {
            if (allImages.length === 0) return;
            
            // Show alert or instruction for mobile users
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            if (isMobile) {
                alert("Trên ĐIỆN THOẠI:\nTrình duyệt chặn việc tự động tải xuống nhiều tệp cùng lúc vì lý do bảo mật.\n\nBạn hãy bấm vào nút màu xám 'Lưu Ảnh...' nằm bên dưới mỗi hình hoặc chạm vào ảnh để xem slide và lưu trực tiếp về máy nhé!");
                return;
            }
            
            // On desktop, trigger batch download with 300ms intervals
            allImages.forEach((img, idx) => {
                setTimeout(() => {
                    const link = document.createElement('a');
                    link.href = img.data;
                    link.download = img.filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }, idx * 300);
            });
        }
        
        // Share image directly to Mobile OS Share Sheet (which contains "Save Image" to Photos app)
        // or fallback to traditional direct download on Desktop.
        async function shareOrDownloadImage(imgUrl, filename) {
            try {
                if (navigator.share && navigator.canShare) {
                    const response = await fetch(imgUrl);
                    const blob = await response.blob();
                    const file = new File([blob], filename, { type: 'image/jpeg' });
                    
                    if (navigator.canShare({ files: [file] })) {
                        await navigator.share({
                            files: [file],
                            title: filename,
                            text: 'Lưu ảnh minh chứng đăng ký sảnh Rivergate'
                        });
                        return;
                    }
                }
            } catch (e) {
                console.warn("Share failed, falling back to download", e);
            }
            
            // Fallback for Desktop
            const link = document.createElement('a');
            link.href = imgUrl;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // ================= Lightbox Slider Logic =================
        let currentSlideIndex = 0;
        let touchStartX = 0;
        let touchEndX = 0;

        function openLightbox(index) {
            if (!allImages || allImages.length === 0) return;
            currentSlideIndex = index;
            updateLightboxSlide();
            
            const modal = document.getElementById('imageModal');
            modal.classList.add('show');
            document.body.style.overflow = 'hidden'; // Lock background scroll
            
            // Bind keyboard arrows
            window.addEventListener('keydown', handleLightboxKeydown);
        }

        function closeLightbox(e) {
            if (e && e.target && e.target.classList && !e.target.classList.contains('modal') && !e.target.classList.contains('lightbox-close')) {
                return;
            }
            const modal = document.getElementById('imageModal');
            modal.classList.remove('show');
            document.body.style.overflow = ''; // Unlock background scroll
            window.removeEventListener('keydown', handleLightboxKeydown);
        }

        function updateLightboxSlide() {
            if (!allImages || allImages.length === 0) return;
            if (currentSlideIndex < 0) currentSlideIndex = allImages.length - 1;
            if (currentSlideIndex >= allImages.length) currentSlideIndex = 0;

            const item = allImages[currentSlideIndex];
            const modalImg = document.getElementById('modalImg');
            
            // Smooth transition animation
            modalImg.style.opacity = '0.3';
            modalImg.style.transform = 'scale(0.97)';
            
            setTimeout(() => {
                modalImg.src = item.data;
                modalImg.alt = item.title;
                modalImg.style.opacity = '1';
                modalImg.style.transform = 'scale(1)';
            }, 100);

            document.getElementById('lightboxCaption').textContent = item.title;
            document.getElementById('lightboxCounter').textContent = `${currentSlideIndex + 1} / ${allImages.length}`;
        }

        function nextSlide() {
            currentSlideIndex++;
            updateLightboxSlide();
        }

        function prevSlide() {
            currentSlideIndex--;
            updateLightboxSlide();
        }

        function saveCurrentSlideImage() {
            if (!allImages || allImages.length === 0) return;
            const item = allImages[currentSlideIndex];
            shareOrDownloadImage(item.data, item.filename);
        }

        function handleLightboxKeydown(e) {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
            if (e.key === 'Escape') closeLightbox();
        }

        // Swipe Gestures for Mobile Touch Devices
        window.addEventListener('DOMContentLoaded', () => {
            const stage = document.getElementById('lightboxStage');
            if (stage) {
                stage.addEventListener('touchstart', (e) => {
                    touchStartX = e.changedTouches[0].screenX;
                }, { passive: true });

                stage.addEventListener('touchend', (e) => {
                    touchEndX = e.changedTouches[0].screenX;
                    const swipeDistance = touchEndX - touchStartX;
                    if (Math.abs(swipeDistance) > 40) {
                        if (swipeDistance < 0) {
                            nextSlide(); // Vuốt sang trái -> Xem ảnh kế tiếp
                        } else {
                            prevSlide(); // Vuốt sang phải -> Xem ảnh trước
                        }
                    }
                }, { passive: true });
            }
        });
    </script>
</body>
</html>
