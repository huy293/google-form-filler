<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Form Auto-Filler (Web Mobile)</title>
    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6c5ce7;
            --primary-hover: #5b4bc4;
            --primary-light: rgba(108, 92, 231, 0.15);
            --bg-gradient: linear-gradient(135deg, #0f0c1b 0%, #15102a 50%, #06020f 100%);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-focus-border: rgba(108, 92, 231, 0.4);
            --text: #f7fafc;
            --text-muted: #a0aec0;
            --success: #00b894;
            --error: #ff7675;
            --card-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
        }

        .container {
            width: 100%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 5px;
            margin-top: 10px;
        }

        header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(to right, #a55eea, #45aaf2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        header p {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Glassmorphism Navigation Tab */
        .tabs {
            display: flex;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 5px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px 15px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
        }

        /* Glassmorphism Card Wrapper */
        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 22px;
            box-shadow: var(--card-shadow);
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .card.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 18px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 10px;
            color: #d1d8e0;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="tel"],
        input[type="date"],
        input[type="time"],
        select {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: var(--text);
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        /* Color of date/time icons in dark mode */
        input::-webkit-calendar-picker-indicator {
            filter: invert(1);
            opacity: 0.6;
            cursor: pointer;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            margin-bottom: 20px;
            cursor: pointer;
            font-size: 13px;
        }

        .checkbox-container input {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }

        .btn-submit:disabled {
            background: #4b4b5e;
            color: var(--text-muted);
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Uploader UI styling */
        .upload-area {
            border: 2px dashed var(--glass-border);
            border-radius: 15px;
            padding: 30px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.01);
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: rgba(108, 92, 231, 0.03);
        }

        .upload-area svg {
            width: 40px;
            height: 40px;
            fill: var(--text-muted);
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        .upload-area:hover svg {
            fill: var(--primary);
            transform: translateY(-2px);
        }

        .upload-area p {
            font-size: 14px;
            color: var(--text-muted);
        }

        .upload-area span {
            font-size: 12px;
            color: #7f8c8d;
            display: block;
            margin-top: 5px;
        }

        #fileInput {
            display: none;
        }

        /* Progress Bar & Loader */
        .progress-container {
            display: none;
            margin-top: 20px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 15px;
            border: 1px solid var(--glass-border);
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .progress-bar-bg {
            height: 8px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #a55eea, var(--primary));
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        /* Result display table */
        .guest-list-table {
            width: 100%;
            margin-top: 15px;
            border-collapse: collapse;
            font-size: 13px;
            max-height: 250px;
            overflow-y: auto;
            display: block;
        }

        .guest-list-table thead, .guest-list-table tbody {
            display: table;
            width: 100%;
            table-layout: fixed;
        }

        .guest-list-table th, .guest-list-table td {
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid var(--glass-border);
        }

        .guest-list-table th {
            color: var(--text-muted);
            font-weight: 500;
        }

        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
        }

        .status-pending { background: rgba(241, 196, 15, 0.15); color: #f1c40f; }
        .status-success { background: rgba(0, 184, 148, 0.15); color: var(--success); }
        .status-error { background: rgba(255, 118, 117, 0.15); color: var(--error); }

        /* Notification overlay */
        .notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 90%;
            text-align: center;
        }

        .notification.show {
            transform: translateX(-50%) translateY(0);
        }

        .notification.success {
            background: #00b894;
            color: white;
        }

        .notification.error {
            background: #ff7675;
            color: white;
        }

        /* File name indicator */
        .file-selected {
            background: var(--primary-light);
            border: 1px solid rgba(108, 92, 231, 0.3);
            border-radius: 10px;
            padding: 10px 15px;
            display: none;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .file-selected span {
            font-size: 13px;
            font-weight: 500;
        }

        .btn-clear-file {
            background: transparent;
            border: none;
            color: var(--error);
            font-weight: 600;
            cursor: pointer;
        }

    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>RIVERGATE RESIDENCE</h1>
            <p>Tự động điền và gửi thông tin sảnh nhanh chóng</p>
        </header>

        <!-- Dynamic Tabs -->
        <nav class="tabs">
            <button class="tab-btn active" onclick="switchTab('single')">Nhập Một Khách</button>
            <button class="tab-btn" onclick="switchTab('bulk')">Gửi Hàng Loạt</button>
        </nav>

        <!-- Card: Single Guest Input -->
        <section id="singleCard" class="card active">
            <h2>Đăng ký thông tin khách đơn lẻ</h2>
            <form id="singleForm" onsubmit="handleSingleSubmit(event)">
                <div class="form-group">
                    <label>Người Đăng Ký (Full Name)</label>
                    <input type="text" id="regName" required placeholder="Họ tên người đại diện đăng ký">
                </div>
                <div class="form-group">
                    <label>Số ĐT Người Đăng Ký (Phone)</label>
                    <input type="tel" id="regPhone" required placeholder="Số điện thoại người đại diện">
                </div>
                
                <div style="border-top: 1px dashed var(--glass-border); margin: 20px 0;"></div>

                <div class="form-group">
                    <label>Họ Tên Khách (Guest Name)</label>
                    <input type="text" id="guestName" required placeholder="Họ tên khách vào căn hộ">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Năm Sinh</label>
                        <input type="text" id="guestBirth" required placeholder="Ví dụ: 1990">
                    </div>
                    <div class="form-group">
                        <label>Mã Căn Hộ</label>
                        <input type="text" id="unitCode" required placeholder="Ví dụ: A-12.34">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Hộ Chiếu / CCCD</label>
                        <input type="text" id="guestId" required placeholder="Số ID / Hộ chiếu">
                    </div>
                    <div class="form-group">
                        <label>Quốc Tịch</label>
                        <input type="text" id="guestNation" required placeholder="Ví dụ: Việt Nam / USA">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>VISA</label>
                        <input type="text" id="visa" placeholder="Nếu có">
                    </div>
                    <div class="form-group">
                        <label>Hạn VISA</label>
                        <input type="date" id="visaExpiry">
                    </div>
                </div>

                <div class="form-group">
                    <label>Hộ khẩu thường trú (Address)</label>
                    <input type="text" id="address" required placeholder="Nơi đăng ký thường trú / Tạm trú">
                </div>

                <div class="form-group">
                    <label>Chủ Thể (Subject)</label>
                    <select id="subject" required>
                        <option value="Khách đến thăm/ Visitors">Khách đến thăm / Visitors</option>
                        <option value="Khách thuê mới chuyển đến tòa nhà không có thông tin cư trú  / New tenants who move in have no residence information">Khách thuê mới chuyển đến / New tenants</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Ngày đến</label>
                        <input type="date" id="checkInDate" required>
                    </div>
                    <div class="form-group">
                        <label>Giờ vào</label>
                        <input type="time" id="checkInTime" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Ngày ra</label>
                    <input type="date" id="checkOutDate" required>
                </div>

                <label class="checkbox-container">
                    <input type="checkbox" id="agreement" checked required>
                    Đồng ý và cam kết tuân thủ nội quy tòa nhà
                </label>

                <button type="submit" id="btnSingleSubmit" class="btn-submit">Nhập & Gửi Ngay</button>
            </form>
        </section>

        <!-- Card: Bulk Input -->
        <section id="bulkCard" class="card">
            <h2>Gửi form hàng loạt từ tệp tin</h2>
            
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <svg viewBox="0 0 24 24">
                    <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
                </svg>
                <p>Nhấp vào đây để tải lên danh sách</p>
                <span>Hỗ trợ tệp tin Excel (.xlsx) hoặc tệp (.csv)</span>
                <input type="file" id="fileInput" accept=".csv, .xlsx" onchange="handleFileSelect(event)">
            </div>

            <div class="file-selected" id="fileIndicator">
                <span id="fileNameDisplay">file_name.csv</span>
                <button class="btn-clear-file" onclick="clearFile()">Xóa</button>
            </div>

            <!-- Progress section -->
            <div class="progress-container" id="progressContainer">
                <div class="progress-label">
                    <span id="progressText">Đang gửi: 0/0 khách</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressBarFill"></div>
                </div>

                <table class="guest-list-table" id="guestTable">
                    <thead>
                        <tr>
                            <th style="width: 10%;">STT</th>
                            <th style="width: 60%;">Tên khách</th>
                            <th style="width: 30%;">Trạng thái</th>
                        </tr>
                    </thead>
                    <tbody id="guestTableBody">
                        <!-- Dynamic rows will be inserted here -->
                    </tbody>
                </table>
            </div>

            <button id="btnBulkSubmit" class="btn-submit" disabled onclick="handleBulkSubmit()">Bắt Đầu Gửi Hàng Loạt</button>
        </section>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="notification"></div>

    <script>
        // Set default dates on load
        window.addEventListener('load', () => {
            const today = new Date();
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 4); // Default Checkout is checkin + 4 days as sample
            
            // Format YYYY-MM-DD
            const formatDate = (date) => {
                const y = date.getFullYear();
                const m = String(date.getMonth() + 1).padStart(2, '0');
                const d = String(date.getDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;
            };

            document.getElementById('checkInDate').value = formatDate(today);
            document.getElementById('checkOutDate').value = formatDate(tomorrow);
            
            // Default check-in time is current time
            const hours = String(today.getHours()).padStart(2, '0');
            const minutes = String(today.getMinutes()).padStart(2, '0');
            document.getElementById('checkInTime').value = `${hours}:${minutes}`;
        });

        // Switch between single and bulk tabs
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.card').forEach(card => card.classList.remove('active'));

            if (tab === 'single') {
                event.target.classList.add('active');
                document.getElementById('singleCard').classList.add('active');
            } else {
                event.target.classList.add('active');
                document.getElementById('bulkCard').classList.add('active');
            }
        }

        // Show toast notification
        function showNotification(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `notification ${type} show`;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Handle single guest submission
        async function handleSingleSubmit(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btnSingleSubmit');
            btn.disabled = true;
            btn.textContent = "Đang gửi...";

            // Construct payload dictionary
            const payload = {
                "Họ và tên người đăng ký": document.getElementById('regName').value,
                "Số điện thoại người đăng ký": document.getElementById('regPhone').value,
                "Họ và tên khách": document.getElementById('guestName').value,
                "Năm sinh": document.getElementById('guestBirth').value,
                "Mã Căn Hộ": document.getElementById('unitCode').value,
                "Hộ Chiếu_CCCD": document.getElementById('guestId').value,
                "VISA": document.getElementById('visa').value || "",
                "Hạn VISA": document.getElementById('visaExpiry').value || "",
                "Quốc tịch": document.getElementById('guestNation').value,
                "Thông tin hộ khẩu": document.getElementById('address').value,
                "Chủ thể": document.getElementById('subject').value,
                "Ngày đến": document.getElementById('checkInDate').value,
                "Thời gian vào": document.getElementById('checkInTime').value,
                "Ngày ra": document.getElementById('checkOutDate').value,
                "Cam kết tuân thủ": document.getElementById('agreement').checked ? "Tôi đã đọc và đồng ý" : ""
            };

            try {
                const response = await fetch('/api/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload),
                });

                const result = await response.json();
                if (response.ok && result.success) {
                    showNotification("Đã gửi thông tin đăng ký thành công!");
                    // Clear guest inputs, keep representative details for convenience
                    document.getElementById('guestName').value = "";
                    document.getElementById('guestBirth').value = "";
                    document.getElementById('guestId').value = "";
                    document.getElementById('visa').value = "";
                    document.getElementById('visaExpiry').value = "";
                } else {
                    showNotification(result.error || "Gửi thất bại, đã xảy ra lỗi.", "error");
                }
            } catch (err) {
                showNotification("Lỗi kết nối tới Server.", "error");
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.textContent = "Nhập & Gửi Ngay";
            }
        }

        // Keep track of bulk rows
        let bulkGuests = [];

        // Handle file selection for bulk submit
        async function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('fileNameDisplay').textContent = file.name;
            document.getElementById('fileIndicator').style.display = 'flex';

            const formData = new FormData();
            formData.append("file", file);

            try {
                // Upload file to parse it
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                if (response.ok && result.success) {
                    bulkGuests = result.guests;
                    showNotification(`Đã tải lên thành công danh sách ${bulkGuests.length} khách!`);
                    
                    // Render the table
                    const tbody = document.getElementById('guestTableBody');
                    tbody.innerHTML = "";
                    bulkGuests.forEach((guest, index) => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${index + 1}</td>
                            <td><strong>${guest["Họ và tên khách"] || "Chưa có tên"}</strong></td>
                            <td><span class="status-badge status-pending" id="status-${index}">Đang chờ</span></td>
                        `;
                        tbody.appendChild(tr);
                    });

                    document.getElementById('progressContainer').style.display = 'block';
                    document.getElementById('btnBulkSubmit').disabled = false;
                    
                    // Update progress display
                    document.getElementById('progressText').textContent = `Đang chuẩn bị: 0/${bulkGuests.length} khách`;
                    document.getElementById('progressBarFill').style.width = '0%';
                    document.getElementById('progressPercent').textContent = '0%';
                } else {
                    showNotification(result.error || "Lỗi đọc tệp danh sách.", "error");
                    clearFile();
                }
            } catch (err) {
                showNotification("Lỗi tải tệp lên server.", "error");
                console.error(err);
                clearFile();
            }
        }

        // Clear uploaded file
        function clearFile() {
            document.getElementById('fileInput').value = "";
            document.getElementById('fileIndicator').style.display = 'none';
            document.getElementById('progressContainer').style.display = 'none';
            document.getElementById('btnBulkSubmit').disabled = true;
            bulkGuests = [];
        }

        // Submit bulk list sequentially
        async function handleBulkSubmit() {
            const btn = document.getElementById('btnBulkSubmit');
            btn.disabled = true;
            btn.textContent = "Đang xử lý...";

            const total = bulkGuests.length;
            let successCount = 0;

            for (let i = 0; i < total; i++) {
                const statusBadge = document.getElementById(`status-${i}`);
                statusBadge.textContent = "Đang gửi...";
                statusBadge.className = "status-badge status-pending";

                const guest = bulkGuests[i];
                
                try {
                    const response = await fetch('/api/submit', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(guest),
                    });

                    const result = await response.json();
                    
                    if (response.ok && result.success) {
                        statusBadge.textContent = "Thành công";
                        statusBadge.className = "status-badge status-success";
                        successCount++;
                    } else {
                        statusBadge.textContent = "Thất bại";
                        statusBadge.className = "status-badge status-error";
                    }
                } catch (err) {
                    statusBadge.textContent = "Lỗi kết nối";
                    statusBadge.className = "status-badge status-error";
                }

                // Update Progress bar
                const percent = Math.round(((i + 1) / total) * 100);
                document.getElementById('progressBarFill').style.width = `${percent}%`;
                document.getElementById('progressPercent').textContent = `${percent}%`;
                document.getElementById('progressText').textContent = `Đang xử lý: ${i + 1}/${total} khách`;
                
                // Add minor delay between submissions to avoid spamming
                await new Promise(resolve => setTimeout(resolve, 600));
            }

            showNotification(`Đã hoàn tất gửi danh sách! Thành công: ${successCount}/${total}`);
            btn.textContent = "Đã Hoàn Tất";
        }
    </script>
</body>
</html>
