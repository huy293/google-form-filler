version: '3.8'

services:
  app:
    build: .
    container_name: google-form-filler
    restart: always
    ports:
      - "1111:1111"
    environment:
      - PORT=1111
      - ADMIN_USER=admin
      - ADMIN_PASS=admin
    volumes:
      - ./.sessions.json:/app/.sessions.json
      - ./.pro_sessions.json:/app/.pro_sessions.json
